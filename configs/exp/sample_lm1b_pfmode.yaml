# @package _global_

name: sample/lm1b_pfmode
model_path:

sampling:
  batch_per_gpu: 0
  predictor    : pfm_ode   # deterministic probability-flow ODE (full expectation)
  steps        : 512
  pfm:
    topk               : 0
    topp               : 1.0
    mc_samples         : 1
    stochastic         : false
    use_inv_time       : true
    use_scheduler_coeff: false

eval:
  batch_size    : 0
  n_iters       : 200
  entropy       : True
  nll           : True
  gen_ppl       : True
  eval_model    : gpt2
  simul_steps   : 500
