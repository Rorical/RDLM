# @package _global_
name: text8

defaults:
  - /model: dit_small_text8

original_tokens  : 27
tokens           : 27

training:
  batch_size   : 512
  accum        : 1
  n_iters      : 50001
  snapshot_freq: 50000
  log_freq     : 50
  eval_freq    : 1000
  snapshot_freq_for_preemption: 5000
  snapshot_sampling: True
  ema          : 0.9999
  loss_type    : pfm

data:
  train    : text8
  valid    : text8
  cache_dir: data

sampling:
  steps       : 256
  predictor   : pfm_ode
  decode      : posterior
  pfm:
    topk               : 0        # 0 = no truncation
    topp               : 0.95     # nucleus truncation for added entropy
    mc_samples         : 4        # Monte Carlo averaging of directions
    stochastic         : true     # enable MC sampling of directions
    use_inv_time       : false    # avoid blow-up near t->1
    use_scheduler_coeff: true     # apply scheduler scaling in PFM ODE

eval:
  batch_size    : ${training.batch_size}
  n_iters       : 200
  entropy       : True
  eval_model    : gptj
  nll           : True
  simul_steps   : 500
